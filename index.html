<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <link rel="stylesheet" href="style.css">

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" i
   ntegrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" 
   crossorigin="anonymous" 
   referrerpolicy="no-referrer" />

   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" 
rel="stylesheet">

   <script src="js file.js" defer></script>
<body>
<div class="card">
   <h2 class="heading">Enter Your password</h2>
   <div class="profile">
      <img src="https://avatars.githubusercontent.com/u/150904148?v=4" 
      alt="Avatar" width="50" height="50">
      <div class="profile-details">
         <p>Business Account</p>
         <h4>Evans Njenga</h4>  
      </div>
   </div>
   <div class="field">
      <label for="password">Password</label>
      <div class="input-wrapper">
         <div class="input-group">
            <i class="fa fa-lock" aria-hidden="true"></i>
            <input placeholder="**********" type="password" id="password">
            

         </div>
         <i class="fa fa-eye-slash" aria-hidden="true" id="eye-icon"></i>


      </div>
   </div>
   <div class="switch-button-wrapper">
      <div class="switch-wrapper">
         <label for="toggle" class="switch">
            <input type="checkbox" id="toggle">
            <span class="ball"></span>
         </label>
         <p>Stay signed in</p>
      </div>
      <button class="continue-btn">Continue</button>
   </div>
   <p class="resset-link">Reset Password</p>
</div>

 
</body>
</html>
